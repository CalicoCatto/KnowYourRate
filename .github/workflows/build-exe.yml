name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Frontend Build ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # ── Backend Build ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          pip install -e ".[build]"
        working-directory: backend

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller knowyourrate.spec --noconfirm
        working-directory: backend

      # ── Package ──
      - name: Create release archive
        run: |
          Compress-Archive -Path backend/dist/KnowYourRate.exe -DestinationPath KnowYourRate-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnowYourRate-windows-x64
          path: KnowYourRate-windows-x64.zip

      # ── Release (only on tag push) ──
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: KnowYourRate-windows-x64.zip
          generate_release_notes: true
